{% extends "base.html" %}
{% block title %}设置管理密码 · 小米音箱控制台{% endblock %}
{% block auth %}
<div class="auth-card">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 10v4M10 7v10M14 9v6M18 11v2"/></svg>
    </span>
    <span class="brand-name">小米音箱控制台</span>
  </div>
  <div class="panel">
    <form class="panel-body" method="post" action="/setup">
      <h1>设置管理密码</h1>
      <p class="lead">以后登录控制台都用这个密码。不要用小米账号的密码。</p>
      {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
      <div class="field">
        <label for="password">新密码</label>
        <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password">
        <p class="hint">至少 8 位。</p>
      </div>
      <div class="field">
        <label for="confirm">再输入一次</label>
        <input id="confirm" type="password" name="confirm" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field">
        <button type="submit" class="btn-primary btn-block">保存并进入控制台</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
